# diffusion training config
use_self_cond: True
data_channels: 2
seq_length: 24
time_steps: 500  # 训练阶段的采样步数
sampling_time_steps: 500  # 生成阶段的采样步数
beta_schedule: 'linear'  # 'cosine'
ddim_sampling_eta: 0.0
time_emb_type: Sine

# condition config
raw_feature_dim: 45
gat_layers: 4
rep_dim: 128  # region 表征的维度
gat_heads: 4
dropout: 0.1
cond_emb_dim: 256
# reference transformer 配置
refer_dim: 256
refer_head_num: 4
refer_layer_num: 2
hour_dim: 64
weekday_dim: 64
month_dim: 64
use_retrieve: True
retrieve_top_k: 5
retrieve_metric: euclidean
use_self_reference: False

# global training config
device: 'cuda:0'
#pretrain_epoch: 30000
pretrain_epoch: 8000
diff_train_epoch: 300
batch_size: 256
lr: 0.5e-5
ema_decay: 0.995
update_every: 10

use_sim_loss: True
use_w_loss: True

grid_len: -1

# ablation
use_region_emb: True
use_time_emb: True
use_month: False
sample_num:
  train: 30000
  test: 10000
