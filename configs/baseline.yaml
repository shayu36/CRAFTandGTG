# ===== 基线配置 (baseline) =====
# use_gtg_topology=false: 模型结构与原始 CRAFT 逐字节等价, 旧 ckpt/{city}_rep.npy 完全可加载。
# 仅数据路径改为: 只读 CRAFT 区域/道路 + Paper 内生成的 norm 流量。

# diffusion training config
use_self_cond: True
data_channels: 2
seq_length: 24
time_steps: 500
sampling_time_steps: 500
beta_schedule: 'linear'
ddim_sampling_eta: 0.0
time_emb_type: Sine

# condition config
raw_feature_dim: 45
gat_layers: 4
rep_dim: 128
gat_heads: 4
dropout: 0.1
cond_emb_dim: 256
refer_dim: 256
refer_head_num: 4
refer_layer_num: 2
hour_dim: 64
weekday_dim: 64
month_dim: 64
use_retrieve: True
retrieve_top_k: 5
retrieve_metric: euclidean
use_self_reference: False

# global training config
device: 'cuda:0'
pretrain_epoch: 8000
diff_train_epoch: 300
batch_size: 256
lr: 0.5e-5
ema_decay: 0.995
update_every: 10

use_sim_loss: True
use_w_loss: True

grid_len: -1

# ablation
use_region_emb: True
use_time_emb: True
use_month: False
sample_num:
  train: 30000
  test: 10000

# ===== 数据路径 (第一阶段新增; 只读 CRAFT, 写在 Paper) =====
craft_data_root: /root/autodl-tmp/projects/CRAFT/cleared_data
norm_flow_root: /root/autodl-tmp/projects/Paper/data/norm_flow

# ===== GTG 融合开关 =====
use_gtg_topology: false
