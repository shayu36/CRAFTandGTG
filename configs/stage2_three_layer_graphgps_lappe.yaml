# 第二阶段：第一阶段 START v2 三层静态图 → 联合异构 GraphGPS + LapPE。
# 该入口与 HCFM/Flow Matching 的 stage2 配置完全独立。

model:
  name: three_layer_graphgps_lappe
  hidden_dim: 128
  output_dim: 48
  num_layers: 2
  dropout: 0.1

posenc:
  type: LapPE
  laplacian_norm: sym
  joint_num_eig: 16
  pe_dim: 16
  encoder: DeepSet
  cache: true
  cache_dir: cache/graphgps_lappe_v3_weighted

frequency:
  enabled: true
  method: low_rank_spectral_projection
  decomposition_position: after_graphgps
  joint_low_modes: 16
  orthogonality_tolerance: 0.001
  reconstruction_tolerance: 0.00001
  output_version: three-layer-joint-graphgps-weighted-spectral-features-v3
  export_dir: outputs/stage2_three_layer_graphgps_lappe/spectral_features

attention:
  # 全部 M+K+N 节点共享同一个全局注意力分支。
  global_attn: linear
  # joint 保持项目要求的全联合节点注意力；same_layer 可用于严格层内全局传播审计。
  global_attention_scope: joint
  full_attention_max_nodes: 4096
  num_heads: 4

hierarchy:
  road_to_syntax_pool: mean
  syntax_to_region_pool: weighted_mean

data:
  hierarchy_cache_dir: cache/static_hierarchy_start_v2
  hierarchy_feature_version: three-layer-start-road-v2
  norm_flow_root: data/norm_flow
  source_cities:
    - beijing
    - chengdushi
    - xianshi
  target_city: null
  seq_length: 24
  split_ratios: [0.8, 0.1, 0.1]

training:
  batch_size: 1
  lr: 0.0001
  weight_decay: 0.00001
  epochs: 100
  seed: 20260905
  device: cpu
  output_dir: outputs/stage2_three_layer_graphgps_lappe
