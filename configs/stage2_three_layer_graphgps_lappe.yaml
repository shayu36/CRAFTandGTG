# 第二阶段第一版：第一阶段 START v2 三层静态图 → GraphGPS + LapPE。
# 该入口与 HCFM/Flow Matching 的 stage2 配置完全独立。

model:
  name: three_layer_graphgps_lappe
  hidden_dim: 128
  output_dim: 48
  num_layers_road: 2
  num_layers_syntax: 2
  num_layers_region: 2
  dropout: 0.1

posenc:
  type: LapPE
  laplacian_norm: sym
  road_num_eig: 16
  syntax_num_eig: 16
  region_num_eig: 16
  pe_dim: 16
  encoder: DeepSet
  cache: true
  cache_dir: cache/graphgps_lappe_v1

attention:
  # Road 默认使用线性全局注意力；标准 full attention 必须显式配置。
  road_global_attn: linear
  road_full_attn_max_nodes: 4096
  syntax_global_attn: full
  region_global_attn: full
  num_heads: 4

hierarchy:
  road_to_syntax_pool: mean
  syntax_to_region_pool: weighted_mean

data:
  hierarchy_cache_dir: cache/static_hierarchy_start_v2
  hierarchy_feature_version: three-layer-start-road-v2
  norm_flow_root: data/norm_flow
  source_cities:
    - beijing
    - chengdushi
    - xianshi
  target_city: null
  seq_length: 24
  split_ratios: [0.8, 0.1, 0.1]

training:
  batch_size: 1
  lr: 0.0001
  weight_decay: 0.00001
  epochs: 100
  seed: 20260905
  device: cpu
  output_dir: outputs/stage2_three_layer_graphgps_lappe
