# 第一阶段 GTG+CRAFT+Diffusion；供回归/消融 A1 使用。
model_mode: stage1_diffusion
generator_type: diffusion
use_gtg: true
use_hierarchy: false
use_micro_adversarial: false
generate_macro: true
generate_micro: false
prior_mode: independent
ode_solver: euler
ode_steps: 16
use_cross_state: false
use_cross_velocity: false
freeze_macro_encoder: false
freeze_micro_encoder: false

use_self_cond: true
data_channels: 2
seq_length: 24
time_steps: 500
sampling_time_steps: 500
beta_schedule: linear
ddim_sampling_eta: 0.0
time_emb_type: Sine
raw_feature_dim: 45
gat_layers: 4
rep_dim: 128
gat_heads: 4
dropout: 0.1
cond_emb_dim: 256
refer_dim: 256
refer_head_num: 4
refer_layer_num: 2
hour_dim: 64
weekday_dim: 64
month_dim: 64
use_retrieve: true
retrieve_top_k: 5
retrieve_metric: euclidean
use_self_reference: false
device: cuda:0
pretrain_epoch: 8000
diff_train_epoch: 300
batch_size: 256
lr: 0.000005
ema_decay: 0.995
update_every: 10
use_sim_loss: true
use_w_loss: true
grid_len: -1
use_region_emb: true
use_time_emb: true
use_month: false
sample_num: {train: 30000, test: 10000}
craft_data_root: ../CRAFT/cleared_data
norm_flow_root: data/norm_flow
use_gtg_topology: true
gtg_cache_dir: cache/gtg
gtg_feature_dim: 9
gtg_gat_layers: 4
gtg_gat_heads: 8
gtg_dropout: 0.1

